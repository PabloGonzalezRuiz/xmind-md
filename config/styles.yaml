# Configuración de estilos compatible con el resolutor IR 1.0.0.
# Las propiedades se agrupan por tipo de elemento y usan el vocabulario neutral.
# La matriz de propiedades materializables en XMind está en docs/xmind-adapter.md.

style_sets:
  BASE_ACADEMICO:
    topic:
      text:
        font_family: Arial
        font_size: 14
        color: "#263B5A"

  TAI_LEGISLACION:
    topic:
      text:
        font_family: Arial
        font_size: 14
      background:
        color: "#FFFFFF"
    styles:
      concepto_importante:
        topic:
          text:
            color: "#9C0006"
            bold: true
          border:
            color: "#C00000"
            width: 1.5

styles:
  relacion_default:
    relationship:
      line:
        color: "#607D8B"
        width: 1.5
        pattern: solid

  agrupacion_derechos:
    boundary:
      border:
        color: "#607D8B"
        width: 1.5

  resumen:
    summary:
      text:
        color: "#263B5A"
        bold: true
