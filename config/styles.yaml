# Configuración de estilos de ejemplo para XMind MD.
# Las claves son neutrales; no usar aquí atributos internos de XMind.
# La especificación completa está en docs/style-system.md.

version: 1

defaults:
  elements:
    map:
      background:
        color: "#FFFFFF"

styles: {}

style_sets:
  BASE_ACADEMICO:
    description: "Base visual reutilizable para mapas de estudio."
    elements:
      topic:
        roles:
          root:
            typography:
              font_size: 20
              font_weight: bold
          main:
            typography:
              font_size: 16
              font_weight: bold
          subtopic:
            typography:
              font_size: 13
              font_weight: normal
      branch:
        line:
          color: "#78909C"
          width: 1.5

  TAI_LEGISLACION:
    description: "Estilos para mapas de legislación del temario TAI."
    extends: BASE_ACADEMICO
    elements:
      topic:
        roles:
          root:
            shape:
              type: rounded_rectangle
              fill:
                color: "#263B5A"
            text:
              color: "#FFFFFF"
          main:
            shape:
              type: rounded_rectangle
              fill:
                color: "#DCE6F1"
            text:
              color: "#172B4D"
    styles:
      concepto_importante:
        applies_to: topic
        properties:
          shape:
            fill:
              color: "#FCE4D6"
          border:
            color: "#C00000"
            width: 1.5
          text:
            color: "#9C0006"
          typography:
            font_weight: bold
