# Integración continua: ejecutar pruebas y controles de calidad en Ubuntu.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format
        run: python -m ruff format --check src tests

      - name: Download XMind reference fixture
        run: |
          python -c "from pathlib import Path; from urllib.request import urlretrieve; p=Path('tests/fixtures'); p.mkdir(parents=True, exist_ok=True); urlretrieve('https://raw.githubusercontent.com/sc0tfree/xmind-mcp/6225cbcd3e8fc565bc18e80346699a6e118dd0f7/tests/fixture.xmind', p / 'reference.xmind')"

      - name: Tests
        run: python -m pytest

      - name: Build XMind Desktop smoke test
        run: python scripts/create_xmind_smoke.py

      - name: Upload XMind smoke test
        uses: actions/upload-artifact@v4
        with:
          name: xmind-desktop-smoke-test
          path: output/xmind-md-smoke-test.xmind
          if-no-files-found: error
          retention-days: 14
