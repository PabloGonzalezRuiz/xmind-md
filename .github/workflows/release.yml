name: Prepare and publish XMind MD release

# Manual release workflow; GitHub should expose it in Actions.
on:
  workflow_dispatch:
    inputs:
      desktop_smoke_verified:
        description: 'Confirmación: smoke del commit candidato abierto, guardado y reabierto en XMind Desktop'
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'

permissions:
  contents: write

concurrency:
  group: xmind-md-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish 0.1.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Verify release authorization and candidate version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release workflow must run from main." >&2
            exit 1
          fi
          if [[ "${{ inputs.desktop_smoke_verified }}" != "yes" ]]; then
            echo "Manual XMind Desktop smoke verification is required." >&2
            exit 1
          fi
          CI_SUCCESS="$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml --json status,conclusion --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
          if [[ "$CI_SUCCESS" -lt 1 ]]; then
            echo "No successful CI run found for this exact commit." >&2
            exit 1
          fi
          VERSION="$(PYTHONPATH=src python -c 'from xmind_md import __version__; print(__version__)')"
          test "$VERSION" = "0.1.0"
          grep -Fq "## [0.1.0]" CHANGELOG.md
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Ensure release tag does not already exist
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ -n "$REMOTE_TAG" ]; then
            echo "The tag $TAG already exists; refusing to move or replace it." >&2
            exit 1
          fi

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution contents and license
        run: python scripts/verify_distributions.py dist

      - name: Generate SHA-256 checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS.txt

      - name: Publish GitHub Release and create tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "XMind MD $TAG (Alpha)" \
            --notes-file docs/releases/v0.1.0.md
