name: "PMD · XMind Study Analyzer"

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/xmind-study/*.xmind"
      - "scripts/analyze_xmind_study.py"
      - ".github/workflows/pmd-xmind-study-analyzer.yml"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze study maps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyze XMind files
        run: python scripts/analyze_xmind_study.py
      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmd-xmind-study-analysis
          path: pmd-xmind-study-report/
          if-no-files-found: error
          retention-days: 14
