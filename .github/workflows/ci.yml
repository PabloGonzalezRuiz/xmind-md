# Integración continua: calidad, pruebas y validación de distribuciones.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format
        run: python -m ruff format --check src tests

      - name: Download XMind reference fixture
        run: |
          python -c "from pathlib import Path; from urllib.request import urlretrieve; p=Path('tests/fixtures'); p.mkdir(parents=True, exist_ok=True); urlretrieve('https://raw.githubusercontent.com/sc0tfree/xmind-mcp/6225cbcd3e8fc565bc18e80346699a6e118dd0f7/tests/fixture.xmind', p / 'reference.xmind')"

      - name: Tests
        run: python -m pytest

      - name: Build XMind Desktop smoke test
        run: python scripts/create_xmind_smoke.py

      - name: Upload XMind smoke test
        uses: actions/upload-artifact@v4
        with:
          name: xmind-desktop-smoke-test
          path: output/xmind-md-smoke-test.xmind
          if-no-files-found: error
          retention-days: 14

  build-distributions:
    name: Build and install distributions (Ubuntu)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution contents and license
        run: python scripts/verify_distributions.py dist

      - name: Install and test wheel in a clean virtual environment
        shell: bash
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install dist/*.whl
          mkdir -p /tmp/xmind-md-wheel-test
          printf "# Package smoke test\\n\\n## Installed wheel\\n" > /tmp/xmind-md-wheel-test/input.md
          (cd /tmp/xmind-md-wheel-test && "$GITHUB_WORKSPACE/.venv-wheel/bin/xmind-md" input.md --output result.json)
          test -s /tmp/xmind-md-wheel-test/result.json
          .venv-wheel/bin/python -c "import json; from pathlib import Path; data=json.loads(Path('/tmp/xmind-md-wheel-test/result.json').read_text()); assert data"

      - name: Install and test sdist in a separate clean virtual environment
        shell: bash
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install dist/*.tar.gz
          mkdir -p /tmp/xmind-md-sdist-test
          printf "# Package smoke test\\n\\n## Installed sdist\\n" > /tmp/xmind-md-sdist-test/input.md
          (cd /tmp/xmind-md-sdist-test && "$GITHUB_WORKSPACE/.venv-sdist/bin/xmind-md" input.md --output result.json)
          test -s /tmp/xmind-md-sdist-test/result.json
          .venv-sdist/bin/python -c "import json; from pathlib import Path; data=json.loads(Path('/tmp/xmind-md-sdist-test/result.json').read_text()); assert data"

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
