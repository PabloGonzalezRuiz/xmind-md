# Integración continua: calidad, pruebas y validación de distribuciones.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Ubuntu / Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format
        run: python -m ruff format --check src tests

      - name: Download XMind reference fixture
        run: |
          python -c "from pathlib import Path; from urllib.request import urlretrieve; p=Path('tests/fixtures'); p.mkdir(parents=True, exist_ok=True); urlretrieve('https://raw.githubusercontent.com/sc0tfree/xmind-mcp/6225cbcd3e8fc565bc18e80346699a6e118dd0f7/tests/fixture.xmind', p / 'reference.xmind')"

      - name: Tests
        run: python -m pytest

      - name: Build XMind Desktop smoke test
        run: python scripts/create_xmind_smoke.py

      - name: Upload XMind smoke test
        uses: actions/upload-artifact@v6
        with:
          name: xmind-desktop-smoke-test-py${{ matrix.python-version }}
          path: output/xmind-md-smoke-test.xmind
          if-no-files-found: error
          retention-days: 14

  build-distributions:
    name: Build and install distributions (Ubuntu)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution contents and license
        run: python scripts/verify_distributions.py dist

      - name: Install and test wheel in a clean virtual environment
        shell: bash
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install dist/*.whl
          mkdir -p /tmp/xmind-md-wheel-test
          printf "# Package smoke test\\n\\n## Installed wheel\\n" > /tmp/xmind-md-wheel-test/input.md
          (cd /tmp/xmind-md-wheel-test && "$GITHUB_WORKSPACE/.venv-wheel/bin/xmind-md" input.md --output result.json)
          test -s /tmp/xmind-md-wheel-test/result.json
          .venv-wheel/bin/python -c "import json; from pathlib import Path; data=json.loads(Path('/tmp/xmind-md-wheel-test/result.json').read_text()); assert data"
          (cd /tmp/xmind-md-wheel-test && "$GITHUB_WORKSPACE/.venv-wheel/bin/xmind-md" input.md --output result.xmind)
          test -s /tmp/xmind-md-wheel-test/result.xmind
          .venv-wheel/bin/python -c 'import json, zipfile; z=zipfile.ZipFile("/tmp/xmind-md-wheel-test/result.xmind"); names=z.namelist(); assert names[0] == "mimetype"; assert z.read("mimetype") == b"application/vnd.xmind.workbook"; assert z.getinfo("mimetype").compress_type == zipfile.ZIP_STORED; data=json.loads(z.read("content.json")); assert data[0]["rootTopic"]["title"] == "Package smoke test"; assert z.testzip() is None'

      - name: Install and test sdist in a separate clean virtual environment
        shell: bash
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install dist/*.tar.gz
          mkdir -p /tmp/xmind-md-sdist-test
          printf "# Package smoke test\\n\\n## Installed sdist\\n" > /tmp/xmind-md-sdist-test/input.md
          (cd /tmp/xmind-md-sdist-test && "$GITHUB_WORKSPACE/.venv-sdist/bin/xmind-md" input.md --output result.json)
          test -s /tmp/xmind-md-sdist-test/result.json
          .venv-sdist/bin/python -c "import json; from pathlib import Path; data=json.loads(Path('/tmp/xmind-md-sdist-test/result.json').read_text()); assert data"
          (cd /tmp/xmind-md-sdist-test && "$GITHUB_WORKSPACE/.venv-sdist/bin/xmind-md" input.md --output result.xmind)
          test -s /tmp/xmind-md-sdist-test/result.xmind
          .venv-sdist/bin/python -c 'import json, zipfile; z=zipfile.ZipFile("/tmp/xmind-md-sdist-test/result.xmind"); names=z.namelist(); assert names[0] == "mimetype"; assert z.read("mimetype") == b"application/vnd.xmind.workbook"; assert z.getinfo("mimetype").compress_type == zipfile.ZIP_STORED; data=json.loads(z.read("content.json")); assert data[0]["rootTopic"]["title"] == "Package smoke test"; assert z.testzip() is None'

      - name: Upload Python distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
