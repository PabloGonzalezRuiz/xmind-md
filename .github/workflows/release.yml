name: Prepare and publish XMind MD release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xmind-md-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish 0.1.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Verify candidate version and changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'from xmind_md import __version__; print(__version__)')"
          test "$VERSION" = "0.1.0"
          grep -q "^## \\[0.1.0\\]" CHANGELOG.md
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Ensure release tag does not already exist
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ -n "$REMOTE_TAG" ]; then
            echo "The tag $TAG already exists; refusing to move or replace it." >&2
            exit 1
          fi

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution contents and license
        run: python scripts/verify_distributions.py dist

      - name: Publish GitHub Release and create tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "XMind MD $TAG (Alpha)" \
            --notes-file CHANGELOG.md
